name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: Shellcheck hook and kit scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          # .template scripts contain {{PLACEHOLDER}} tokens and are not valid bash yet.
          files=$(find hooks scripts -name '*.sh' -not -name '*.template')
          echo "Checking:"; echo "$files"
          shellcheck $files

  consistency:
    name: Reference and placeholder consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No stale HTML spec-artifact references
        run: |
          # Spec artifacts are markdown since 2.0.0; the old .html names must not
          # reappear as source-of-truth references. Allowed exceptions: the
          # changelog migration notes, the generated manifest (it lists the
          # committed rendered example HTML), the gitignore snippets that name
          # the rendered artifacts (instructions.md, output-project-structure.md,
          # questions.md), plus this workflow itself.
          if grep -rn \
            -e 'requirements\.html' -e 'design\.html' -e 'tasks\.html' \
            -e 'review\.html' -e 'acceptance-tests\.html' -e 'assumptions\.html' \
            -e 'open-questions\.html' -e 'history\.html' -e 'architecture\.html' \
            -e 'conventions\.html' -e 'functional-brief\.html' \
            --include='*.md' --include='*.sh' --include='*.template' \
            --include='*.html' --include='*.json' . \
            | grep -v '^\./CHANGELOG\.md:' \
            | grep -v '^\./manifest\.md:' \
            | grep -v '^\./instructions\.md:' \
            | grep -v '^\./output-project-structure\.md:' \
            | grep -v '^\./questions\.md:' \
            | grep -q .; then
            echo "::error::Stale .html spec-artifact reference found (specs are markdown now; HTML is a rendered artifact)."
            grep -rn \
              -e 'requirements\.html' -e 'design\.html' -e 'tasks\.html' \
              -e 'review\.html' -e 'acceptance-tests\.html' -e 'assumptions\.html' \
              -e 'open-questions\.html' -e 'history\.html' -e 'architecture\.html' \
              -e 'conventions\.html' -e 'functional-brief\.html' \
              --include='*.md' --include='*.sh' --include='*.template' \
              --include='*.html' --include='*.json' . \
              | grep -v '^\./CHANGELOG\.md:' \
            | grep -v '^\./manifest\.md:' \
              | grep -v '^\./instructions\.md:' \
              | grep -v '^\./output-project-structure\.md:' \
              | grep -v '^\./questions\.md:' || true
            exit 1
          fi
          echo "OK: no stale .html spec-artifact references."

      - name: Placeholder tokens only where expected
        run: |
          # {{PLACEHOLDER}} tokens belong in templates/ and scripts/*.template.
          # A few docs legitimately mention the convention itself.
          allowlist='^\./(templates/|scripts/[^/]+\.template$|README\.md$|README\.html$|instructions\.md$|CHANGELOG\.md$|skills/sdd-workflow/spec-format\.md$|skills/sdd-update/SKILL\.md$|scripts/validate-sdd-structure\.sh$|\.github/)'
          offenders=$(grep -rl "{{[A-Z0-9_][A-Z0-9_]*}}" . --include='*.md' --include='*.sh' --include='*.html' --include='*.json' --include='*.template' --include='*.css' --include='*.js' | grep -Ev "$allowlist" || true)
          if [ -n "$offenders" ]; then
            echo "::error::Unexpected {{PLACEHOLDER}} tokens in:"
            echo "$offenders"
            exit 1
          fi
          echo "OK: placeholder tokens only in expected locations."

      - name: Installable content stays harness-neutral
        run: |
          # Agents, skills and templates are installed into any harness (Claude Code,
          # Codex, Cursor, OpenCode, Antigravity). They must not hard-code one harness:
          # no "Claude Code must/should/…" phrasing, no `.claude/` paths, no `CLAUDE.md`
          # as the project instruction file. Lines that are per-harness examples
          # (mentioning at least two harnesses) are allowed.
          offenders=$(grep -rn -E 'Claude (Code )?(must|may|should|can|cannot|never|asks|drafts)|\.claude/|CLAUDE\.md' \
              agents skills/sdd-workflow skills/optional templates/specs templates/functional \
              templates/AGENTS.md.template templates/project-map.md.template \
              templates/architecture.md.template templates/conventions.md.template \
            | grep -v -E 'Codex|Cursor|OpenCode|Antigravity|harness-primitives|claude-note' || true)
          if [ -n "$offenders" ]; then
            echo "::error::Harness-specific wording in installable content:"
            echo "$offenders"
            exit 1
          fi
          echo "OK: installable content is harness-neutral."

      - name: Hook adapter block is identical in every hook
        run: |
          # The SDD hook adapter (hooks/hooks-policy.md, "Hook contract") must be
          # byte-identical across the example hooks apart from the default event name.
          extract() { sed -n '/^# ---- SDD hook adapter/,/^# ---- end SDD hook adapter ----/p' "$1" | sed -E 's/sdd_event:-[A-Za-z]+/sdd_event:-EVENT/'; }
          ref=$(extract hooks/examples/block-implementation-before-approval.sh)
          [ -n "$ref" ] || { echo "::error::adapter block not found in the reference hook"; exit 1; }
          for f in $(find hooks/examples -name '*.sh'); do
            if [ "$(extract "$f")" != "$ref" ]; then
              echo "::error::adapter block in $f differs from block-implementation-before-approval.sh"
              diff <(echo "$ref") <(extract "$f") || true
              exit 1
            fi
          done
          echo "OK: adapter block identical in $(find hooks/examples -name '*.sh' | wc -l | tr -d ' ') hooks."

      - name: manifest.md is up to date
        run: |
          bash scripts/update-manifest.sh
          if ! git diff --exit-code manifest.md; then
            echo "::error::manifest.md is stale. Run scripts/update-manifest.sh and commit the result."
            exit 1
          fi
          echo "OK: manifest.md matches git ls-files."
